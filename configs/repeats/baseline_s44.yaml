stage: baseline
model: models/yolo11n.pt
train:
  epochs: 100
  imgsz: 320
  batch: 16
  workers: 2
  seed: 44
  deterministic: true
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.0005
  warmup_epochs: 3.0
  patience: 0
  amp: true
  cache: false
  val: true
  save: true
  plots: true
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0
  close_mosaic: 10
